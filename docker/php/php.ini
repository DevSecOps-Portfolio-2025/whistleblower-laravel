; ================================================
; WhistleBlower Vault - Custom PHP Configuration
; Optimized for Laravel Development
; ================================================

[PHP]
; Maximum execution time
max_execution_time = 300

; Maximum input time
max_input_time = 300

; Memory limit
memory_limit = 512M

; Maximum POST size
post_max_size = 100M

; Maximum upload file size
upload_max_filesize = 100M

; Maximum number of files that can be uploaded
max_file_uploads = 20

; Display errors (set to Off in production)
display_errors = On
display_startup_errors = On

; Error reporting
error_reporting = E_ALL

; Timezone
date.timezone = UTC

; Session
session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=redis_secret"

; Expose PHP version
expose_php = Off
