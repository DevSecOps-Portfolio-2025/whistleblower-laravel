# ================================================
# WhistleBlower Vault - Docker Compose
# Professional Development Environment
# ================================================

services:
  # ==========================================
  # PHP-FPM Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whistleblower-app:latest
    container_name: wb_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-whistleblower}
      - DB_USERNAME=${DB_USERNAME:-wb_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - whistleblower-network
    depends_on:
      - db
      - redis

  # ==========================================
  # Nginx Web Server
  # ==========================================
  web:
    image: nginx:alpine
    container_name: wb_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - whistleblower-network
    depends_on:
      - app

  # ==========================================
  # MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: wb_mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-whistleblower}
      MYSQL_USER: ${DB_USERNAME:-wb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - whistleblower-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache Service
  # ==========================================
  redis:
    image: redis:alpine
    container_name: wb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - whistleblower-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

# ==========================================
# Networks
# ==========================================
networks:
  whistleblower-network:
    driver: bridge
    name: whistleblower-network

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  db_data:
    driver: local
    name: wb_mysql_data
  redis_data:
    driver: local
    name: wb_redis_data
